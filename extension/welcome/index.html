<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Welcome to Tabora ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&family=Lalezar&family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #22d3ee; --violet: #8b5cf6; --pink: #f472b6; --gold: #fbbf24; }
  html { scrollbar-width: none; }
  body {
    min-height: 100vh; overflow-x: hidden; color: #f4f6ff;
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    background: #050816; position: relative;
  }
  ::-webkit-scrollbar { display: none; }

  /* ==== background layers ==== */
  #sky { position: fixed; inset: 0; z-index: -3; }
  .aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .42; animation: drift 16s ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { width: 55vw; height: 55vw; background: #0e7490; top: -18%; inset-inline-start: -10%; }
  .aurora span:nth-child(2) { width: 46vw; height: 46vw; background: #6d28d9; bottom: -20%; inset-inline-end: -8%; animation-delay: -5s; }
  .aurora span:nth-child(3) { width: 34vw; height: 34vw; background: #be185d; top: 30%; inset-inline-start: 40%; animation-delay: -9s; opacity: .26; }
  @keyframes drift { to { transform: translate(6vw, -5vh) scale(1.14); } }
  #glow-cursor { position: fixed; width: 640px; height: 640px; border-radius: 50%; z-index: -1; pointer-events: none;
    background: radial-gradient(circle, rgba(34,211,238,.09), rgba(139,92,246,.05) 42%, transparent 68%);
    transform: translate(-50%, -50%); transition: opacity .4s; }
  /* top loading line */
  #boot-bar { position: fixed; top: 0; inset-inline-start: 0; height: 3px; width: 100%; z-index: 60; transform-origin: var(--tw, right); transform: scaleX(0);
    background: linear-gradient(90deg, var(--accent), var(--violet), var(--pink)); animation: boot 1.6s cubic-bezier(.6,.1,.3,1) forwards; }
  @keyframes boot { 60% { transform: scaleX(.72); } 100% { transform: scaleX(1); opacity: 0; } }

  .wrap { max-width: 1020px; margin: 0 auto; padding: 6vh 24px 70px; text-align: center; }

  /* ==== orbiting logo ==== */
  .logo-box { display: inline-grid; place-items: center; position: relative; width: 190px; height: 190px; margin-bottom: 6px; animation: pop 1s cubic-bezier(.2,1.5,.4,1) both; }
  .logo-core { width: 112px; height: 112px; border-radius: 30px; box-shadow: 0 0 70px rgba(34,211,238,.45), 0 0 120px rgba(139,92,246,.25); position: relative; z-index: 2; animation: breathe 4s ease-in-out infinite; }
  .logo-core img { width: 100%; height: 100%; border-radius: 30px; }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  @keyframes pop { from { transform: scale(.3) rotate(-14deg); opacity: 0; } }
  .orbit { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(255,255,255,.14); animation: spin var(--spd, 14s) linear infinite; }
  .orbit.o2 { inset: 26px; border-style: solid; border-color: rgba(255,255,255,.07); --spd: 9s; animation-direction: reverse; }
  .orbit i { position: absolute; top: -5px; inset-inline-start: calc(50% - 5px); width: 10px; height: 10px; border-radius: 50%; }
  .orbit.o1 i { background: var(--accent); box-shadow: 0 0 14px 3px rgba(34,211,238,.7); }
  .orbit.o2 i { background: var(--pink); box-shadow: 0 0 12px 3px rgba(244,114,182,.7); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==== hero text ==== */
  h1 {
    font-family: 'Vazirmatn', sans-serif;
    font-size: clamp(2.1rem, 6vw, 3.8rem); font-weight: 900; line-height: 1.4; margin-top: 10px;
    background: linear-gradient(110deg, #fff 20%, var(--accent) 38%, var(--violet) 52%, #fff 68%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: rise .9s .25s cubic-bezier(.2,.9,.3,1) both, shimmer 5s 1.4s linear infinite;
  }
  @keyframes shimmer { to { background-position: -220% 0; } }
  .sub { color: rgba(244,246,255,.62); font-size: clamp(.95rem, 2vw, 1.2rem); margin-top: 12px; min-height: 1.9em; animation: rise .9s .4s both; }
  .sub .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -3px; margin-inline-start: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { transform: translateY(26px); opacity: 0; } }

  /* lang pill */
  .lang-pill { display: inline-flex; gap: 6px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); padding: 5px; border-radius: 99px; margin: 24px 0 4px; animation: rise .9s .5s both; }
  .lang-pill button { padding: 8px 24px; border: none; border-radius: 99px; color: #f4f6ff; font-family: inherit; font-weight: 700; font-size: .9rem; cursor: pointer; background: transparent; transition: .25s; }
  .lang-pill button.active { background: linear-gradient(120deg, var(--accent), var(--violet)); color: #081018; }

  /* ==== feature cards ==== */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 30px 0 28px; perspective: 900px; }
  .card {
    position: relative; overflow: hidden;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.1);
    border-radius: 22px; padding: 24px 16px; backdrop-filter: blur(14px);
    transition: transform .25s ease, border-color .25s, box-shadow .25s;
    animation: rise .8s both; transform-style: preserve-3d; will-change: transform;
  }
  .card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .3s; pointer-events: none;
    background: radial-gradient(240px circle at var(--tx,50%) var(--ty,50%), rgba(34,211,238,.13), transparent 65%); }
  .card:hover::before { opacity: 1; }
  .card:nth-child(1) { animation-delay: .5s; } .card:nth-child(2) { animation-delay: .62s; } .card:nth-child(3) { animation-delay: .74s; }
  .card:nth-child(4) { animation-delay: .86s; } .card:nth-child(5) { animation-delay: .98s; } .card:nth-child(6) { animation-delay: 1.1s; }
  .card:hover { border-color: var(--accent); box-shadow: 0 18px 50px rgba(34,211,238,.14); }
  .card .ico { font-size: 2.15rem; display: block; margin-bottom: 10px; filter: drop-shadow(0 0 14px rgba(34,211,238,.55)); transition: transform .3s; }
  .card:hover .ico { transform: scale(1.18) rotate(-6deg); }
  .card b { font-size: .95rem; line-height: 1.95; display: block; }
  .card .tip { display: block; margin-top: 6px; font-size: .7rem; color: rgba(244,246,255,.42); }

  /* ==== auth card ==== */
  .auth-wrap { position: relative; max-width: 460px; margin: 8px auto 0; animation: rise .9s 1.15s both; }
  .auth-wrap::before { content: ''; position: absolute; inset: -1.5px; border-radius: 27px; z-index: 0;
    background: conic-gradient(from var(--ang, 0deg), var(--accent), var(--violet), var(--pink), var(--accent));
    animation: angspin 6s linear infinite; }
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes angspin { to { --ang: 360deg; } }
  .auth-card {
    position: relative; z-index: 1; background: rgba(9,12,28,.92);
    border-radius: 26px; padding: 30px 28px; backdrop-filter: blur(26px); text-align: start;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .auth-card h3 { font-size: 1.15rem; margin-bottom: 6px; }
  .auth-card p { color: rgba(244,246,255,.55); font-size: .82rem; margin-bottom: 16px; line-height: 1.9; }
  .auth-card input {
    width: 100%; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13);
    border-radius: 13px; padding: 12px 15px; color: #f4f6ff; font-family: inherit; font-size: .88rem; outline: none;
    margin-bottom: 12px; transition: .25s;
  }
  .auth-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(34,211,238,.13); background: rgba(255,255,255,.08); }
  .auth-card input::placeholder { color: rgba(244,246,255,.32); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-inline-end: 46px; }
  .eye { position: absolute; top: 7px; inset-inline-end: 8px; background: none; border: none; cursor: pointer; font-size: 1rem; opacity: .55; }
  .eye.on, .eye:hover { opacity: 1; }
  .err { color: #f87171; font-size: .76rem; min-height: 1.2em; margin: -4px 0 8px; }
  .cta {
    width: 100%; padding: 13px; font-family: inherit; font-size: .95rem; font-weight: 800; cursor: pointer;
    border: none; border-radius: 14px; color: #071018; position: relative; overflow: hidden;
    background: linear-gradient(120deg, var(--accent), var(--violet));
    box-shadow: 0 10px 30px rgba(34,211,238,.25); transition: .25s;
  }
  .cta:hover { filter: brightness(1.12); transform: translateY(-2px); box-shadow: 0 14px 36px rgba(139,92,246,.35); }
  .cta::after { content: ''; position: absolute; top: 0; inset-inline-start: -80%; width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); transform: skewX(-20deg); animation: sheen 3.4s ease-in-out infinite; }
  @keyframes sheen { 40%, 100% { inset-inline-start: 130%; } }
  .swap { text-align: center; font-size: .78rem; color: rgba(244,246,255,.5); margin-top: 12px; }
  .swap button { background: none; border: none; color: var(--accent); font-family: inherit; font-size: .78rem; cursor: pointer; font-weight: 700; }
  .swap button:hover { text-decoration: underline; }
  .ghost-btn {
    display: block; margin: 18px auto 0; padding: 11px 30px; border-radius: 99px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14); color: #f4f6ff;
    font-family: inherit; font-size: .84rem; font-weight: 700; transition: .25s;
  }
  .ghost-btn:hover { border-color: var(--accent); background: rgba(34,211,238,.09); }
  .foot { margin-top: 34px; font-size: .7rem; color: rgba(244,246,255,.28); letter-spacing: .5px; }

  /* confetti */
  .confetti { position: fixed; top: -14px; z-index: 80; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(108vh) rotate(720deg); opacity: .4; } }

  /* burst ring on success */
  .burst { position: fixed; z-index: 79; border-radius: 50%; border: 2px solid var(--accent); pointer-events: none;
    animation: burst .9s cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes burst { from { width: 10px; height: 10px; opacity: 1; top: 45vh; left: 48vw; } to { width: 70vw; height: 70vw; opacity: 0; top: calc(45vh - 35vw); left: calc(48vw - 35vw); } }

  @media (max-width: 760px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .logo-box { width: 150px; height: 150px; }
    .logo-core { width: 88px; height: 88px; border-radius: 24px; }
    .logo-core img { border-radius: 24px; }
  }
</style>
</head>
<body>
<div id="boot-bar"></div>
<canvas id="sky"></canvas>
<div class="aurora"><span></span><span></span><span></span></div>
<div id="glow-cursor"></div>

<div class="wrap">
  <!-- logo with orbits -->
  <div class="logo-box">
    <div class="orbit o1"><i></i></div>
    <div class="orbit o2"><i></i></div>
    <div class="logo-core"><img src="../assets/logo_full.png" alt="Tabora"></div>
  </div>

  <h1 id="w-title">به تبورا خوش اومدی</h1>
  <div class="sub"><span id="w-sub"></span><span class="cursor"></span></div>

  <div class="lang-pill">
    <button id="lang-fa">فارسی</button>
    <button id="lang-en">English</button>
  </div>

  <!-- features -->
  <div class="cards" id="cards">
    <div class="card"><span class="ico">🗓️</span><b id="f1"></b><span class="tip">Jalali calendar</span></div>
    <div class="card"><span class="ico">🖼️</span><b id="f2"></b><span class="tip">Live wallpapers</span></div>
    <div class="card"><span class="ico">💬</span><b id="f3"></b><span class="tip">Friends &amp; chat</span></div>
    <div class="card"><span class="ico">📜</span><b id="f4"></b><span class="tip">Fall-e Hafez</span></div>
    <div class="card"><span class="ico">🌤️</span><b id="f5"></b><span class="tip">Weather &amp; prices</span></div>
    <div class="card"><span class="ico">⏱️</span><b id="f6"></b><span class="tip">Focus &amp; site blocker</span></div>
  </div>

  <!-- auth -->
  <div class="auth-wrap">
    <div class="auth-card">
      <div id="form-login">
        <h3 id="t-login">خوش برگشتی 👋</h3>
        <p id="hint1"></p>
        <input id="l-id">
        <div class="pw-wrap"><input id="l-pw" type="password"><button type="button" class="eye" data-for="l-pw" title="👁">👁</button></div>
        <div class="err" id="l-err"></div>
        <button class="cta" id="btn-login"></button>
        <div class="swap"><span id="sw1"></span> <button id="to-reg"></button></div>
        <div class="swap"><button id="to-recover"></button></div>
      </div>

      <div id="form-register" style="display:none">
        <h3 id="t-reg"></h3>
        <p id="hint2"></p>
        <input id="r-email" type="email">
        <input id="r-uname">
        <input id="r-name">
        <div class="pw-wrap"><input id="r-pw" type="password"><button type="button" class="eye" data-for="r-pw" title="👁">👁</button></div>
        <div class="err" id="r-err"></div>
        <button class="cta" id="btn-register"></button>
        <div class="swap"><span id="sw2"></span> <button id="to-login"></button></div>
      </div>

      <div id="form-recover" style="display:none">
        <h3 id="t-rec"></h3>
        <p id="hint3"></p>
        <input id="rc-id">
        <input id="rc-code" dir="ltr" placeholder="TBRA-XXXX-XXXX">
        <div class="pw-wrap"><input id="rc-pw" type="password"><button type="button" class="eye" data-for="rc-pw" title="👁">👁</button></div>
        <div class="err" id="rc-err"></div>
        <button class="cta" id="btn-recover"></button>
        <div class="swap"><span id="sw3"></span> <button id="rec-to-login"></button></div>
      </div>

      <button class="ghost-btn" id="btn-guest"></button>
    </div>
  </div>

  <div class="foot">TA B O R A — Smart New Tab ✨</div>
</div>

<script src="../js/shim.js"></script>
<script>
const API_BASE = 'https://tabora-api.nexaextensionsir-8af.workers.dev';
let lang = 'fa';
const TXT = {
  fa: {
    title: 'به تبورا خوش اومدی', sub: 'نیوتبِ هوشمندت — هر تبِ جدید، یه دنیای خوشگل ✨',
    f1: 'تقویم شمسی و رویدادها', f2: 'والپیپرهای متحرک', f3: 'دوستان و چت زنده',
    f4: 'فال حافظ و اوقات شرعی', f5: 'هوا، ارز و طلا', f6: 'فوکوس و مسدودساز',
    tLogin: 'خوش برگشتی 👋', hint1: 'تنظیماتت توی فضای ابری ذخیره می‌شه؛ با هر آپدیت اکسنشن همه‌چیز سر جاش می‌مونه.',
    tReg: 'به تبورا بپیوند 🚀', hint2: 'یه حساب بساز تا پروفایل، آواتار متحرک و تنظیماتت همیشه همراهت باشه.',
    forgot: 'رمزم رو فراموش کردم', tRec: 'بازیابی رمز عبور 🔑', hintRec: 'کد بازیابی‌ات (از ربات تلگرام) رو وارد کن.',
    sw1: 'حساب نداری؟', reg: 'ثبت‌نام کن', sw2: 'حساب داری؟', login: 'وارد شو',
    ph: { lid: 'ایمیل یا نام کاربری', lpw: 'رمز عبور', re: 'ایمیل', ru: 'نام کاربری (انگلیسی)', rn: 'نام نمایشی', rp: 'رمز عبور (حداقل ۶ کاراکتر)', rc: 'کد بازیابی', rnp: 'رمز جدید' },
    err: { http_401: '❌ شناسه یا رمز اشتباهه', http_409: '❌ این ایمیل یا نام کاربری قبلاً ثبت شده' },
    btnLogin: 'ورود به تبورا', btnReg: 'ساخت حساب و ورود', guest: 'ادامه به عنوان مهمان',
    codeTitle: '🔑 کد بازیابی تو', codeHint: 'یه جایی نگهش دار — باهاش می‌تونی رمزت رو برگردونی (یا از ربات تلگرام بگیرش)', copy: '📋 کپی', copied: '✅ کپی شد!',
    btnRec: 'تغییر رمز عبور', recOk: '✅ رمزت عوض شد — حالا با رمز جدید وارد شو',
    success: '🎉 خوش اومدی!'
  },
  en: {
    title: 'Welcome to Tabora', sub: 'Your smart new tab — every tab, a tiny universe ✨',
    f1: 'Jalali calendar & events', f2: 'Live wallpapers', f3: 'Friends & live chat',
    f4: 'Hafez fal & prayer times', f5: 'Weather & prices', f6: 'Focus & site blocker',
    tLogin: 'Welcome back 👋', hint1: 'Your settings live in the cloud — everything stays in place across updates.',
    tReg: 'Join Tabora 🚀', hint2: 'Create an account so your profile, animated avatar and settings follow you.',
    forgot: 'I forgot my password', tRec: 'Password recovery 🔑', hintRec: 'Enter your recovery code (from the Telegram bot).',
    sw1: 'No account yet?', reg: 'Sign up', sw2: 'Already have one?', login: 'Log in',
    ph: { lid: 'Email or username', lpw: 'Password', re: 'Email', ru: 'Username (English)', rn: 'Display name', rp: 'Password (min 6 chars)', rc: 'Recovery code', rnp: 'New password' },
    err: { http_401: '❌ Wrong credentials', http_409: '❌ Email or username already taken' },
    btnLogin: 'Enter Tabora', btnReg: 'Create account & enter', guest: 'Continue as guest',
    codeTitle: '🔑 Your recovery code', codeHint: 'Keep it safe — it restores your password (or get one from the Telegram bot)', copy: '📋 Copy', copied: '✅ Copied!',
    btnRec: 'Change password', recOk: '✅ Password changed — now log in with the new one',
    success: '🎉 Welcome!'
  }
};

/* typewriter subtitle */
let typeTimer = null;
function typeSubtitle(text) {
  clearTimeout(typeTimer);
  const el = document.getElementById('w-sub');
  el.textContent = '';
  let i = 0;
  (function step() {
    if (i <= text.length) {
      el.textContent = text.slice(0, i++);
      typeTimer = setTimeout(step, 34);
    }
  })();
}
function applyLang() {
  const t = TXT[lang];
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  document.getElementById('w-title').textContent = t.title;
  typeSubtitle(t.sub);
  ['f1','f2','f3','f4','f5','f6'].forEach(k => document.getElementById(k).textContent = t[k]);
  document.getElementById('t-login').textContent = t.tLogin;
  document.getElementById('t-reg').textContent = t.tReg;
  document.getElementById('hint1').textContent = t.hint1;
  document.getElementById('hint2').textContent = t.hint2;
  document.getElementById('btn-login').textContent = t.btnLogin;
  document.getElementById('btn-register').textContent = t.btnReg;
  document.getElementById('btn-guest').textContent = t.guest;
  document.getElementById('to-recover').textContent = t.forgot;
  document.getElementById('t-rec').textContent = t.tRec;
  document.getElementById('hint3').textContent = t.hintRec;
  document.getElementById('btn-recover').textContent = t.btnRec;
  document.getElementById('sw3').textContent = t.sw2;
  document.getElementById('rec-to-login').textContent = t.login;
  document.getElementById('rc-id').placeholder = t.ph.lid;
  document.getElementById('rc-code').placeholder = t.ph.rc;
  document.getElementById('rc-pw').placeholder = t.ph.rnp;
  document.getElementById('sw1').textContent = t.sw1;
  document.getElementById('to-reg').textContent = t.reg;
  document.getElementById('sw2').textContent = t.sw2;
  document.getElementById('to-login').textContent = t.login;
  const p = t.ph;
  document.getElementById('l-id').placeholder = p.lid;
  document.getElementById('l-pw').placeholder = p.lpw;
  document.getElementById('r-email').placeholder = p.re;
  document.getElementById('r-uname').placeholder = p.ru;
  document.getElementById('r-name').placeholder = p.rn;
  document.getElementById('r-pw').placeholder = p.rp;
  document.getElementById('lang-fa').classList.toggle('active', lang === 'fa');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
}
document.getElementById('lang-fa').onclick = () => { lang = 'fa'; applyLang(); };
document.getElementById('lang-en').onclick = () => { lang = 'en'; applyLang(); };

/* ===== constellation sky (canvas) + shooting stars + parallax ===== */
(function () {
  const cv = document.getElementById('sky'), cx = cv.getContext('2d');
  let W, H, pts = [], mouse = { x: .5, y: .5 };
  function size() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.min(120, Math.round(W * H / 16000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
      r: Math.random() * 1.5 + .4, tw: Math.random() * Math.PI * 2
    }));
  }
  addEventListener('resize', size); size();
  addEventListener('mousemove', e => { mouse.x = e.clientX / W; mouse.y = e.clientY / H; });
  const shots = [];
  setInterval(() => {
    if (Math.random() < .5 && shots.length < 2) shots.push({ x: Math.random() * W * .8 + W * .1, y: Math.random() * H * .3, vx: 6 + Math.random() * 5, vy: 2.4 + Math.random() * 2, life: 1 });
  }, 2400);
  (function frame(t) {
    cx.clearRect(0, 0, W, H);
    const px = (mouse.x - .5) * 14, py = (mouse.y - .5) * 10;
    /* connect close points */
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      p.x += p.vx; p.y += p.vy; p.tw += .03;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      for (let j = i + 1; j < pts.length; j++) {
        const q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if (d2 < 12000) {
          cx.strokeStyle = 'rgba(140,170,255,' + (0.14 * (1 - d2 / 12000)) + ')';
          cx.lineWidth = 1;
          cx.beginPath(); cx.moveTo(p.x + px * .3, p.y + py * .3); cx.lineTo(q.x + px * .3, q.y + py * .3); cx.stroke();
        }
      }
      const a = .45 + .4 * Math.sin(p.tw);
      cx.fillStyle = 'rgba(255,255,255,' + a + ')';
      cx.beginPath(); cx.arc(p.x + px, p.y + py, p.r, 0, 7); cx.fill();
    }
    /* shooting stars */
    for (let s = shots.length - 1; s >= 0; s--) {
      const sh = shots[s];
      sh.x += sh.vx; sh.y += sh.vy; sh.life -= .012;
      if (sh.life <= 0) { shots.splice(s, 1); continue; }
      const g = cx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 12, sh.y - sh.vy * 12);
      g.addColorStop(0, 'rgba(255,255,255,' + (.9 * sh.life) + ')');
      g.addColorStop(1, 'transparent');
      cx.strokeStyle = g; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(sh.x, sh.y); cx.lineTo(sh.x - sh.vx * 12, sh.y - sh.vy * 12); cx.stroke();
    }
    requestAnimationFrame(frame);
  })();
})();

/* cursor glow */
(function () {
  const g = document.getElementById('glow-cursor');
  addEventListener('mousemove', e => { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; });
})();

/* 3D tilt + spotlight on cards */
(function () {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.style.transform = 'rotateY(' + ((x - .5) * 12) + 'deg) rotateX(' + ((.5 - y) * 10) + 'deg) translateY(-6px)';
      card.style.setProperty('--tx', x * 100 + '%');
      card.style.setProperty('--ty', y * 100 + '%');
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
})();

/* forms */
document.getElementById('to-reg').onclick = () => { form('register'); };
document.getElementById('to-login').onclick = () => { form('login'); };
document.getElementById('to-recover').onclick = () => { form('recover'); };
document.getElementById('rec-to-login').onclick = () => { form('login'); };
document.getElementById('btn-recover').onclick = async () => {
  const errEl = document.getElementById('rc-err'); errEl.textContent = '';
  try {
    await api('/api/recover', {
      identifier: document.getElementById('rc-id').value.trim(),
      code: document.getElementById('rc-code').value.trim(),
      password: document.getElementById('rc-pw').value
    });
    errEl.style.color = '#86efac';
    errEl.textContent = TXT[lang].recOk;
    setTimeout(() => { errEl.style.color = ''; form('login'); document.getElementById('l-id').value = document.getElementById('rc-id').value; }, 1600);
  } catch (e) { errEl.textContent = TXT[lang].err[e.message] || e.message; }
};
function form(m) {
  document.getElementById('form-login').style.display = m === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('form-recover').style.display = m === 'recover' ? 'block' : 'none';
}

async function saveAndGo(token, user, code) {
  const prev = await chrome.storage.local.get(['settings']);
  const settings = Object.assign({}, prev.settings || {}, { lang });
  await chrome.storage.local.set({ token, user, settings });
  celebrate();
  const t = TXT[lang];
  const codeBox = code ? `<div style="margin:14px 0;padding:16px;border-radius:16px;border:1px dashed rgba(34,211,238,.5);background:rgba(0,0,0,.35)">
    <b>${t.codeTitle}</b><p style="font-size:.72rem;opacity:.7;margin:6px 0 10px">${t.codeHint}</p>
    <div dir="ltr" style="font-size:1.25rem;letter-spacing:2px;font-weight:800;color:#7dd3fc">${code}</div>
    <button class="cta" id="btn-copy-code" style="margin-top:10px;padding:8px 14px;font-size:.75rem">${t.copy}</button></div>` : '';
  document.querySelector('.auth-card').innerHTML = `<h3 style="text-align:center;font-size:1.5rem">${t.success}</h3>` + codeBox + `<br><button class="cta" id="btn-enter">${t.btnLogin} →</button>`;
  const bc = document.getElementById('btn-copy-code');
  if (bc) bc.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(code); bc.textContent = t.copied; };
  document.getElementById('btn-enter').onclick = enter;
}
function enter() {
  if (typeof chrome !== 'undefined' && chrome.tabs && chrome.tabs.create) chrome.tabs.create({});
  else location.href = '../index.html';
}
document.getElementById('btn-guest').onclick = async () => {
  const prev = await chrome.storage.local.get(['settings']);
  await chrome.storage.local.set({ settings: Object.assign({}, prev.settings || {}, { lang }) });
  celebrate();
  setTimeout(enter, 1100);
};

async function api(path, body) {
  const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'http_' + r.status);
  return d;
}
document.getElementById('btn-login').onclick = async () => {
  const errEl = document.getElementById('l-err'); errEl.textContent = '';
  try {
    const d = await api('/api/login', { identifier: document.getElementById('l-id').value.trim(), password: document.getElementById('l-pw').value });
    await saveAndGo(d.token, d.user);
  } catch (e) { errEl.textContent = TXT[lang].err[e.message] || e.message; }
};
document.getElementById('btn-register').onclick = async () => {
  const errEl = document.getElementById('r-err'); errEl.textContent = '';
  try {
    const d = await api('/api/register', {
      email: document.getElementById('r-email').value.trim(),
      username: document.getElementById('r-uname').value.trim(),
      name: document.getElementById('r-name').value.trim(),
      password: document.getElementById('r-pw').value
    });
    await saveAndGo(d.token, d.user, d.recovery);
  } catch (e) { errEl.textContent = TXT[lang].err[e.message] || e.message; }
};

/* confetti + burst rings */
function celebrate() {
  const colors = ['#22d3ee', '#8b5cf6', '#f472b6', '#fbbf24', '#34d399'];
  for (let i = 0; i < 110; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.width = c.style.height = (5 + Math.random() * 7) + 'px';
    c.style.background = colors[i % colors.length];
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    c.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
    c.style.animationDelay = (Math.random() * .7) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.animationDelay = (i * .22) + 's';
    b.style.borderColor = colors[i % colors.length];
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 2000);
  }
}

/* password eyes */
document.querySelectorAll('.eye').forEach(b => {
  b.onclick = () => {
    const inp = document.getElementById(b.dataset.for);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    b.classList.toggle('on', show);
    inp.focus();
  };
});
applyLang();
